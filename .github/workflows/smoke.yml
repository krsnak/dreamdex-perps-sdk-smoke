name: dreamDEX SDK read-only smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/smoke.yml'
jobs:
  sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run smoke
